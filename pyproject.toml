[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "omnitient"
description = "Portable work packages and self-contained agent handoffs."
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = []
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: English",
    "Operating System :: POSIX",
]

[project.optional-dependencies]
# Black, Ruff, mypy and Bandit are deliberately absent: pre-commit runs them.
dev = [
    "flit_core >=3.4,<4",
    "pre-commit ~=4.7",
    "pytest ~=9.1",
    "pytest-cov ~=7.1",
]

[project.scripts]
omnitient = "omnitient.cli:main"

[tool.flit.module]
name = "omnitient"

[tool.flit.sdist]
exclude = [".pre-commit-config.yaml", ".markdownlint.yaml", "tests/"]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = [
  "B",  # flake8-bugbear
  "I",  # isort
  "ARG",  # flake8-unused-arguments
  "C4",  # flake8-comprehensions
  "ICN",  # flake8-import-conventions
  "G",  # flake8-logging-format
  "PGH",  # pygrep-hooks
  "PIE",  # flake8-pie
  "PL",  # pylint
  "PT",  # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
  "RET",  # flake8-return
  "RUF",  # Ruff-specific
  "SIM",  # flake8-simplify
  "T20",  # flake8-print
  "YTT",  # flake8-2020
  "EXE",  # flake8-executable
  "PYI",  # flake8-pyi
]
ignore = [
  "PLC",  # Convention related pylint codes
  "PLR",  # Refactor related pylint codes
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=omnitient --cov-report=term-missing:skip-covered"
markers = [
  "packaging: builds a wheel and installs it into a throwaway virtualenv (offline)",
]

[tool.coverage.run]
branch = true
source = ["omnitient"]

[tool.coverage.report]
show_missing = true
skip_covered = true
