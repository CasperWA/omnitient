# Shared development-check entry point.
#
#   pre-commit run --all-files                       # everything that runs on commit
#   pre-commit run --all-files --hook-stage manual   # also the heavier manual checks
#
# Run it with the `omnitient` virtualenv active: the local pytest hooks use the
# `python` on PATH so that they test the editable install.

# Python-based hooks run under the repo's baseline interpreter.
default_language_version:
  python: python3.12

# Generated handoffs embed arbitrary file contents verbatim and must not be
# reformatted by the file, formatting or Markdown hooks.
exclude: ^examples/.*/handoffs/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
        name: Check JSON
      - id: check-merge-conflict
      - id: check-toml
        name: Check TOML
      - id: check-yaml
        name: Check YAML
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  # License and copyright notices on every file (REUSE specification).
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  # Static checks for GitHub Actions workflows.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: ["--py312-plus"]

  # Black formats code; blacken-docs formats Python in documentation.
  # Both are pinned to the same Black version.
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: ["black==26.10.1"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args:
          - "--fix"
          - "--exit-non-zero-on-fix"
          - "--show-fixes"
          - "--no-unsafe-fixes"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests|scripts)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        exclude: ^(tests|scripts)/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        args: ["--fix", "--config=.markdownlint.yaml"]

  - repo: local
    hooks:
      # Relative Markdown links must resolve (offline).
      - id: markdown-links
        name: markdown links resolve
        entry: python scripts/check_markdown_links.py
        language: python
        files: \.md$

      - id: pytest
        name: pytest (offline unit tests)
        entry: python -m pytest -q -m "not packaging"
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$

      # The example pins the contract and two modules (examples/README.md).
      # A commit that changes only the contract or the example skips the hook
      # above, so this runs just the example's test for those files. The
      # generated handoffs are excluded from every hook (see `exclude`), so a
      # commit that changes only them runs neither hook; CI covers that.
      - id: pytest-example
        name: pytest (pinned example)
        entry: python -m pytest -q --no-cov tests/test_example.py
        language: system
        pass_filenames: false
        files: ^(docs/o1-contract\.md|examples/.*)$

      # Builds a wheel, installs it into a throwaway virtualenv and runs the
      # console script outside the source tree. Offline, but slower.
      - id: pytest-packaging
        name: pytest (installed-wheel check)
        entry: python -m pytest -q -m packaging
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$
        stages: [manual]
