default_language_version:
  python: python3.12

exclude: ^examples/.*/handoffs/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
        name: Check JSON
      - id: check-merge-conflict
      - id: check-toml
        name: Check TOML
      - id: check-yaml
        name: Check YAML
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: name-tests-test
        args: ["--pytest-test-first"]
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/asottile/pyupgrade
    rev: v3.22.0
    hooks:
      - id: pyupgrade
        args: ["--py312-plus"]

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.1
    hooks:
      - id: black

  - repo: https://github.com/adamchainz/blacken-docs
    rev: 1.20.0
    hooks:
      - id: blacken-docs
        additional_dependencies: ["black==26.10.1"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args:
          - "--fix"
          - "--exit-non-zero-on-fix"
          - "--show-fixes"
          - "--no-unsafe-fixes"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests|scripts)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        args: ["--config-file=pyproject.toml"]
        exclude: ^(tests|scripts)/

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        args: ["--fix", "--config=.markdownlint.yaml"]

  - repo: local
    hooks:
      - id: markdown-links
        name: markdown links resolve
        entry: python scripts/check_markdown_links.py
        language: python
        files: \.md$

      - id: pytest
        name: pytest (offline unit tests)
        entry: python -m pytest -q -m "not packaging"
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$

      - id: pytest-example
        name: pytest (pinned example)
        entry: python -m pytest -q --no-cov tests/test_example.py
        language: system
        pass_filenames: false
        files: ^(docs/o1-contract\.md|examples/.*)$

      - id: pytest-packaging
        name: pytest (installed-wheel check)
        entry: python -m pytest -q -m packaging
        language: system
        pass_filenames: false
        files: ^(src|tests)/.*\.py$
        stages: [manual]
