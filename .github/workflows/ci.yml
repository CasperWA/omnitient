# Pull request and main checks. See docs/ci.md for the runner policy, the
# download behaviour and the steps for making the repository public.
#
# While the repository is private, jobs run on this repository's own
# self-hosted runners and only for pull requests from this repository.
# While it is public, they run on a GitHub-hosted image instead.
# Both paths provision Python with actions/setup-python and are otherwise identical.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Ignore any pip configuration of the machine; the job installs from the
  # default index into a job-local environment.
  PIP_CONFIG_FILE: /dev/null
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  checks:
    name: Format, lint, types and docs (Python 3.12)
    # A skipped job is not a pass: pull requests from forks of a private
    # repository get no checks at all, and nothing here says otherwise.
    if: >-
      !github.event.repository.private ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Private: this repository's runners, selected by four labels. Not bare
    # `self-hosted`, and not the custom `ubuntu-latest` label that those
    # runners also carry. Public: a fixed GitHub-hosted image, never
    # `ubuntu-latest`, which the attached runners would also match.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","sintef-desktop-cwa"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      PYTHON_VERSION: "3.12"
      CI_JOB_KEY: checks
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create the job's scratch directory
        run: bash .github/scripts/ci-scratch.sh create

      - name: Describe the runner
        run: bash .github/scripts/describe-runner.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create the virtual environment
        run: |
          python -m venv "${CI_SCRATCH}/venv"
          echo "${CI_SCRATCH}/venv/bin" >> "${GITHUB_PATH}"
          echo "VIRTUAL_ENV=${CI_SCRATCH}/venv" >> "${GITHUB_ENV}"

      - name: Check the interpreter
        run: |
          python - "${PYTHON_VERSION}" <<'EOF'
          import os
          import sys

          wanted = tuple(int(part) for part in sys.argv[1].split("."))
          print(sys.version)
          print("executable:", sys.executable)
          print("base prefix:", sys.base_prefix)
          if sys.version_info[:2] != wanted:
              raise SystemExit(f"requested {wanted} but running {sys.version_info[:2]}")
          if sys.prefix == sys.base_prefix or not sys.prefix.startswith(os.environ["CI_SCRATCH"]):
              raise SystemExit("not running in the job's own virtual environment")
          if not getattr(sys, "_is_gil_enabled", lambda: True)():
              raise SystemExit("a free-threaded build is not what the lanes verify")
          EOF

      - name: Install the development extra
        run: python -m pip install -e ".[dev]"

      # The pytest hooks run in the test jobs, once per interpreter.
      - name: Run the pre-commit checks
        env:
          SKIP: pytest
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Remove the job's scratch directory
        if: ${{ always() }}
        run: bash .github/scripts/ci-scratch.sh cleanup

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    if: >-
      !github.event.repository.private ||
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","Linux","X64","sintef-desktop-cwa"]') || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    env:
      PYTHON_VERSION: ${{ matrix.python-version }}
      CI_JOB_KEY: ${{ matrix.python-version }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Create the job's scratch directory
        run: bash .github/scripts/ci-scratch.sh create

      - name: Describe the runner
        run: bash .github/scripts/describe-runner.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create the virtual environment
        run: |
          python -m venv "${CI_SCRATCH}/venv"
          echo "${CI_SCRATCH}/venv/bin" >> "${GITHUB_PATH}"
          echo "VIRTUAL_ENV=${CI_SCRATCH}/venv" >> "${GITHUB_ENV}"

      - name: Check the interpreter
        run: |
          python - "${PYTHON_VERSION}" <<'EOF'
          import os
          import sys

          wanted = tuple(int(part) for part in sys.argv[1].split("."))
          print(sys.version)
          print("executable:", sys.executable)
          print("base prefix:", sys.base_prefix)
          if sys.version_info[:2] != wanted:
              raise SystemExit(f"requested {wanted} but running {sys.version_info[:2]}")
          if sys.prefix == sys.base_prefix or not sys.prefix.startswith(os.environ["CI_SCRATCH"]):
              raise SystemExit("not running in the job's own virtual environment")
          if not getattr(sys, "_is_gil_enabled", lambda: True)():
              raise SystemExit("a free-threaded build is not what the lanes verify")
          EOF

      - name: Install the development extra
        run: python -m pip install -e ".[dev]"

      # --verbose keeps pytest's own summary (counts, skips) in the log.
      - name: Run the functional tests
        run: pre-commit run pytest --all-files --verbose

      - name: Run the installed-package test
        run: pre-commit run pytest-packaging --all-files --hook-stage manual --verbose

      - name: Remove the job's scratch directory
        if: ${{ always() }}
        run: bash .github/scripts/ci-scratch.sh cleanup
